<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crooked Lines</title>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
  :root { --paper: #f4f1ea; --ink: #141414; --muted: #555; --red: #d21e1e; }
  @media (prefers-color-scheme: dark) { :root { --paper: #161513; --ink: #eceae4; --muted: #a8a49b; } }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.6 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 64px 16px; }
  h1 { font-family: "Permanent Marker", cursive; font-weight: 400; font-size: 3rem; margin: 0; }
  .line { width: 180px; height: 6px; background: var(--red); border-radius: 3px; transform: rotate(-2deg); margin: 4px 0 20px; }
  p { margin: 0 0 1em; }
  .muted { color: var(--muted); font-size: .95rem; margin-top: 3em; }
  a { color: inherit; text-decoration-color: var(--red); text-underline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1>Crooked Lines</h1>
  <div class="line"></div>
  <p>True cons, heists &amp; frauds, explained in stick figures.</p>
  <p>Watch on <a href="https://www.youtube.com/@CrookedLines">YouTube</a>.</p>
  <p class="muted">Crooked Lines Uploader is the channel's private upload tool. <a href="privacy.html">Privacy policy</a> · <a href="terms.html">Terms of service</a></p>
</main>
</body>
</html>
